services:
  php:
    build:
      context: .
      dockerfile: docker/testing/Dockerfile
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      XDEBUG_MODE: '${XDEBUG_MODE:-off}'
    volumes:
      - .:/app
      - ./docker/testing/php.ini:/usr/local/etc/php/conf.d/zz-testing.ini:ro
  app:
    extends:
      service: php
    profiles: [app]
    environment:
      APP_URL: http://localhost:8085
      DB_DATABASE: /app/database/database.sqlite
    command: php artisan serve --host=0.0.0.0 --port=8085
    ports:
      - '127.0.0.1:8085:8085'
